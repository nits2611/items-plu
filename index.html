<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087763">
<title>Nesters PLU Lookup</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div>
    <h1>Nesters / Save-On PLU Lookup</h1>
    <p>Search item, brand, quantity, PLU, UPC, or keyword.</p>
  </div>
  <button id="installBtn" hidden>Install</button>
</header>

<main>
  <section class="panel">
    <div class="search-header">
      <label for="q">Search</label>
      <span id="count">Loading...</span>
    </div>
    <div class="row">
      <input id="q" type="search" placeholder="banana, 4011, spinach, Taylor, 340 g..." autocomplete="off" autofocus>
      <button id="clearBtn" type="button">Clear</button>
    </div>

    <button id="advancedToggle" class="advanced-toggle" type="button" aria-expanded="false">
      Show filters & tools ▾
    </button>

    <div id="advancedControls" class="advanced-controls" hidden>
      <div class="filters">
        <button class="active" data-filter="all" type="button">All</button>
        <button data-filter="produce" type="button">Produce</button>
        <button data-filter="packaged" type="button">Packaged</button>
        <button data-filter="organic" type="button">Organic</button>
      </div>

      <div class="tools">
        <span id="syncStatus" class="sync-status">Checking data...</span>
        <label class="upload">
          Upload CSV
          <input id="csvUpload" type="file" accept=".csv,text/csv" hidden>
        </label>
        <button id="resetBtn" class="link" type="button">Reset data</button>
      </div>
    </div>
  </section>

  <section id="message" class="message" hidden></section>
  <section id="results" class="results"></section>
</main>

<footer>
  Built-in data works directly from this file. To update, upload/replace CSV with columns: item_name, code, quantity, brand, category, type, image_local, image_url, notes.
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
